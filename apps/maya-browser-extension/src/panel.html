<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Maya Browser Companion</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <main>
      <span class="eyebrow">MAYA / BROWSER</span>
      <h1>Capture context</h1>
      <p class="destination">Destination: <strong id="destination">Connecting…</strong></p>
      <label>Intent <input id="intent" placeholder="Why are you saving this?"></label>
      <button id="page">Save page</button>
      <button id="selection">Save selection</button>
      <button id="screenshot">Save screenshot</button>
      <p id="status">Connecting…</p>
      <button id="options" class="link-button">Extension options</button>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
